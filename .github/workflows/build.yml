name: Build launcher
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11
      - run: unzip -q launcher_sourses_ready.zip
      - run: chmod +x ls/gradlew
      - run: cd ls && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-apk
          path: ls/app/build/outputs/apk/debug/*.apk
